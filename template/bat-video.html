<div class="viewer_container">
    <label style="line-height: 32px;">
        <e-text key="label-video">
        </e-text>
    </label>
    <hr>
    <canvas class="outputImage" style="background-color: black;"></canvas>
    <hr>
    <div style="display:flex; flex-wrap: nowrap;gap:10px;overflow-x:auto;">
        <div style="flex-grow: 1;text-align: left;line-height: 42px;white-space: nowrap;">
            <label>Trail: </label>
            <input type="number" pattern="\d*" inputmode="decimal" class="trailInput" value="3" min="0" max="15"
                step="1">
            <label>궤적: </label>
            <input type="color" class="trail-color" value="#00ff00">
            <input type="number" pattern="\d*"
                inputmode="decimal" class="trail-color-alpha"
                value="100" min="0" max="255">
            <label>배트: </label>
            <input type="color" class="bat-color" value="#ff8000">
            <input type="number" pattern="\d*"
                inputmode="decimal" class="bat-color-alpha"
                value="100" min="0" max="255">
        </div>
        <div style="text-align: right;white-space: nowrap;">
            <button class="save"><e-text key="btn-save"></e-text></button>
        </div>
    </div>
</div>
